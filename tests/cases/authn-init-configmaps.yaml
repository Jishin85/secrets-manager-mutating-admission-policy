# Authenticator init container using namespace ConfigMaps (webhook style)
apiVersion: v1
kind: Pod
metadata:
  name: authn-init-configmaps
  annotations:
    conjur.org/inject: "true"
    conjur.org/inject-type: authenticator
    conjur.org/container-mode: init
    conjur.org/conjurConnConfig: conjur-connect
    conjur.org/conjurAuthConfig: conjur-auth
spec:
  serviceAccountName: token-consumer
  containers:
    - name: app
      image: busybox:1.36
