# Secretless with k8s/crd#<name> and a CRD suffix
apiVersion: v1
kind: Pod
metadata:
  name: secretless-crd
  annotations:
    conjur.org/inject: "true"
    conjur.org/inject-type: secretless
    conjur.org/secretless-config: k8s/crd#my-secretless-crd
    conjur.org/secretless-CRD-suffix: team-a
spec:
  serviceAccountName: demo-app
  containers:
    - name: app
      image: busybox:1.36
