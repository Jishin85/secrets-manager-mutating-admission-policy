# Secretless with configfile#<configmap>
apiVersion: v1
kind: Pod
metadata:
  name: secretless-configfile
  annotations:
    conjur.org/inject: "true"
    conjur.org/inject-type: secretless
    conjur.org/secretless-config: configfile#demo-secretless-config
    conjur.org/authn-identity: host/data/{{DATA_BRANCH}}/system:serviceaccount:{{APP_NS}}:demo-app
spec:
  serviceAccountName: demo-app
  containers:
    - name: app
      image: busybox:1.36
