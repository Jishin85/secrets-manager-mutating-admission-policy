# Authenticator sidecar using cluster parameters and authn-identity (authn-jwt)
apiVersion: v1
kind: Pod
metadata:
  name: authn-sidecar
  annotations:
    conjur.org/inject: "on"
    conjur.org/inject-type: authenticator
    conjur.org/authn-identity: host/data/{{DATA_BRANCH}}/system:serviceaccount:{{APP_NS}}:token-consumer
    conjur.org/conjur-inject-volumes: app
spec:
  serviceAccountName: token-consumer
  containers:
    - name: app
      image: busybox:1.36
