# Secrets Provider in init mode, custom name, existing init container
apiVersion: v1
kind: Pod
metadata:
  name: sp-init
  annotations:
    conjur.org/inject: "yes"
    conjur.org/inject-type: secrets-provider
    conjur.org/container-mode: init
    conjur.org/container-name: sp
    conjur.org/authn-identity: host/data/{{DATA_BRANCH}}/system:serviceaccount:{{APP_NS}}:demo-app
spec:
  serviceAccountName: demo-app
  initContainers:
    - name: setup
      image: busybox:1.36
  containers:
    - name: app
      image: busybox:1.36
