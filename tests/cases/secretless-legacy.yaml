# Secretless with legacy bare ConfigMap name
apiVersion: v1
kind: Pod
metadata:
  name: secretless-legacy
  annotations:
    conjur.org/inject: "true"
    conjur.org/inject-type: secretless
    conjur.org/secretless-config: legacy-config
spec:
  serviceAccountName: demo-app
  containers:
    - name: app
      image: busybox:1.36
