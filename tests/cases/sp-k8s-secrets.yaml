# Secrets Provider writing Kubernetes Secrets: no conjur-secrets volume
apiVersion: v1
kind: Pod
metadata:
  name: sp-k8s-secrets
  annotations:
    conjur.org/inject: "true"
    conjur.org/inject-type: secrets-provider
    conjur.org/container-mode: init
    conjur.org/secrets-destination: k8s_secrets
    conjur.org/conjur-inject-volumes: app
    conjur.org/authn-identity: host/data/{{DATA_BRANCH}}/system:serviceaccount:{{APP_NS}}:k8s-secrets-app
spec:
  serviceAccountName: k8s-secrets-app
  containers:
    - name: app
      image: busybox:1.36
