# Secrets Provider as an init container populating a Kubernetes Secret.
# Needs API access, which relies on the policy mounting the SA token.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:
  conjur-map: |-
    username: data/{{DATA_BRANCH}}/db/username
    password: data/{{DATA_BRANCH}}/db/password
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secrets-provider
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secrets-provider
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secrets-provider
subjects:
  - kind: ServiceAccount
    name: k8s-secrets-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-secrets-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-secrets-app
  template:
    metadata:
      labels:
        app: k8s-secrets-app
      annotations:
        conjur.org/inject: "true"
        conjur.org/inject-type: secrets-provider
        conjur.org/container-mode: init
        conjur.org/secrets-destination: k8s_secrets
        conjur.org/k8s-secrets: |
          - db-credentials
        conjur.org/authn-identity: host/data/{{DATA_BRANCH}}/system:serviceaccount:{{APP_NS}}:k8s-secrets-app
    spec:
      serviceAccountName: k8s-secrets-app
      containers:
        - name: app
          image: busybox:1.36
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
          command: ["sh", "-c", "echo \"username=$DB_USERNAME\"; exec sleep 86400"]
