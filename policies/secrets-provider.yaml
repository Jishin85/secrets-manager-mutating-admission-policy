# Secrets Manager — Secrets Provider for Kubernetes sidecar injection.
#
# Community alternative to the `conjur.org/inject-type: secrets-provider` path
# of the cyberark/sidecar-injector webhook (pkg/inject/secrets-provider.go),
# implemented as an in-process MutatingAdmissionPolicy. The pod annotation
# contract is unchanged.
#
# Injected into the pod:
#   * Secrets Provider container at the FRONT of spec.initContainers
#       - container-mode "init"    -> regular init container
#       - container-mode "sidecar" -> native sidecar (restartPolicy: Always) with
#         a postStart hook, so application containers only start once the first
#         batch of secrets has been provided
#   * Volumes: podinfo (downward API annotations), conjur-status (memory),
#     conjur-secrets (memory, push-to-file only). Volumes that already exist
#     with the same name are left untouched.
#   * conjur-status / conjur-secrets mounts on every container listed in
#     `conjur.org/conjur-inject-volumes`
#   * The pod's service account token mount on the Secrets Provider container
#     (required for k8s_secrets mode; the ServiceAccount admission plugin runs
#     before admission policies, so it never sees the injected container)
#   * authn-jwt (when CONJUR_AUTHN_URL points at /authn-jwt/): a projected
#     service account token volume `jwt-token` with the configured audience,
#     mounted at /var/run/secrets/tokens, and JWT_TOKEN_PATH set accordingly
#   * Annotations: conjur.org/status=injected; container-mode and
#     secrets-destination normalised so Secrets Provider reads the same values
#     the policy acted on; injector-only annotations removed (as the webhook did)
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: secrets-manager-secrets-provider
  labels:
    app.kubernetes.io/part-of: secrets-manager-sidecars
spec:
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "kube-public"]
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: injection-requested
      expression: >-
        has(object.metadata.annotations) &&
        object.metadata.annotations[?'conjur.org/inject'].orValue('').lowerAscii() in ['y', 'yes', 'true', 'on']
    - name: inject-type-secrets-provider
      expression: >-
        object.metadata.annotations[?'conjur.org/inject-type'].orValue('') == 'secrets-provider'
    - name: not-already-injected
      expression: >-
        object.metadata.annotations[?'conjur.org/status'].orValue('').lowerAscii() != 'injected'
    # Invalid values are not mutated here; the companion
    # ValidatingAdmissionPolicy rejects the pod with a descriptive message.
    - name: valid-container-mode
      expression: >-
        object.metadata.annotations[?'conjur.org/container-mode'].orValue('') in ['', 'init', 'sidecar']
    - name: valid-secrets-destination
      expression: >-
        object.metadata.annotations[?'conjur.org/secrets-destination'].orValue('') in ['', 'file', 'k8s_secrets']
  failurePolicy: Fail
  reinvocationPolicy: Never
  variables:
    - name: annotations
      expression: object.metadata.annotations
    - name: config
      expression: "has(params.data) ? params.data : {}"
    - name: isInit
      expression: >-
        variables.annotations[?'conjur.org/container-mode'].orValue('') == 'init'
    - name: containerMode
      expression: "variables.isInit ? 'init' : 'sidecar'"
    - name: containerName
      expression: >-
        variables.annotations[?'conjur.org/container-name'].orValue('') != ''
          ? variables.annotations['conjur.org/container-name']
          : 'cyberark-secrets-provider-for-k8s'
    - name: image
      expression: >-
        variables.annotations[?'conjur.org/container-image'].orValue('') != ''
          ? variables.annotations['conjur.org/container-image']
          : variables.config[?'secretsProviderImage'].orValue('cyberark/secrets-provider-for-k8s:latest')
    - name: imagePullPolicy
      expression: >-
        variables.config[?'imagePullPolicy'].orValue('IfNotPresent')
    - name: secretsDestination
      expression: >-
        variables.annotations[?'conjur.org/secrets-destination'].orValue('') == 'k8s_secrets'
          ? 'k8s_secrets'
          : 'file'
    - name: pushToFile
      expression: variables.secretsDestination == 'file'
    - name: conjurAccount
      expression: >-
        variables.config[?'CONJUR_ACCOUNT'].orValue(variables.config[?'conjurAccount'].orValue(''))
    - name: conjurApplianceUrl
      expression: >-
        variables.config[?'CONJUR_APPLIANCE_URL'].orValue(variables.config[?'conjurApplianceUrl'].orValue(''))
    - name: conjurAuthenticatorId
      expression: >-
        variables.config[?'CONJUR_AUTHENTICATOR_ID'].orValue(variables.config[?'authnK8sAuthenticatorID'].orValue(''))
    - name: conjurAuthnUrl
      expression: >-
        variables.config[?'CONJUR_AUTHN_URL'].orValue('') != ''
          ? variables.config['CONJUR_AUTHN_URL']
          : variables.conjurApplianceUrl + '/authn-k8s/' + variables.conjurAuthenticatorId
    - name: conjurSslCertificate
      expression: >-
        variables.config[?'CONJUR_SSL_CERTIFICATE'].orValue(variables.config[?'conjurSslCertificate'].orValue(''))
    - name: useJwt
      expression: variables.conjurAuthnUrl.contains('/authn-jwt/')
    - name: jwtAudience
      expression: variables.config[?'jwtAudience'].orValue('conjur')
    - name: jwtTokenExpirationSeconds
      expression: int(variables.config[?'jwtTokenExpirationSeconds'].orValue('600'))
    - name: serviceAccountTokenVolume
      expression: >-
        object.spec.containers.exists(c, has(c.volumeMounts) &&
            c.volumeMounts.exists(m, m.mountPath == '/var/run/secrets/kubernetes.io/serviceaccount'))
          ? object.spec.containers
              .filter(c, has(c.volumeMounts) &&
                c.volumeMounts.exists(m, m.mountPath == '/var/run/secrets/kubernetes.io/serviceaccount'))[0]
              .volumeMounts
              .filter(m, m.mountPath == '/var/run/secrets/kubernetes.io/serviceaccount')[0].name
          : ''
    - name: existingVolumeNames
      expression: >-
        has(object.spec.volumes) ? object.spec.volumes.map(v, v.name) : []
    - name: containerNames
      expression: object.spec.containers.map(c, c.name)
    - name: volumeReceivers
      expression: >-
        variables.annotations[?'conjur.org/conjur-inject-volumes'].orValue('')
          .split(',').map(n, n.trim()).filter(n, n != '')
    # Annotations consumed only by the injector and never passed to the
    # sidecar (mirrors sidecarInjectorAnnot in pkg/inject/constants.go).
    - name: injectorOnlyAnnotations
      expression: >-
        [
          'conjur.org/conjurAuthConfig',
          'conjur.org/conjurConnConfig',
          'conjur.org/container-name',
          'conjur.org/conjur-inject-volumes',
          'conjur.org/inject',
          'conjur.org/inject-type',
          'conjur.org/secretless-config',
          'conjur.org/secretless-CRD-suffix',
          'conjur.org/container-image'
        ]
  mutations:
    # A single patch list: annotation removals must come after everything that
    # reads them, and separate mutations would re-evaluate variables against
    # the partially mutated object.
    - patchType: JSONPatch
      jsonPatch:
        expression: >
          [
            JSONPatch{
              op: "add",
              path: "/spec/volumes",
              value: (has(object.spec.volumes) ? object.spec.volumes : []) + (
                [
                  Object.spec.volumes{
                    name: "podinfo",
                    downwardAPI: Object.spec.volumes.downwardAPI{
                      items: [
                        Object.spec.volumes.downwardAPI.items{
                          path: "annotations",
                          fieldRef: Object.spec.volumes.downwardAPI.items.fieldRef{
                            fieldPath: "metadata.annotations"
                          }
                        }
                      ]
                    }
                  },
                  Object.spec.volumes{
                    name: "conjur-status",
                    emptyDir: Object.spec.volumes.emptyDir{medium: "Memory"}
                  }
                ] + (variables.pushToFile ? [
                  Object.spec.volumes{
                    name: "conjur-secrets",
                    emptyDir: Object.spec.volumes.emptyDir{medium: "Memory"}
                  }
                ] : []) + (variables.useJwt ? [
                  Object.spec.volumes{
                    name: "jwt-token",
                    projected: Object.spec.volumes.projected{
                      sources: [
                        Object.spec.volumes.projected.sources{
                          serviceAccountToken: Object.spec.volumes.projected.sources.serviceAccountToken{
                            path: "jwt",
                            audience: variables.jwtAudience,
                            expirationSeconds: variables.jwtTokenExpirationSeconds
                          }
                        }
                      ]
                    }
                  }
                ] : [])
              ).filter(v, !(v.name in variables.existingVolumeNames))
            },
            JSONPatch{
              op: "add",
              path: "/spec/initContainers",
              value: [
                Object.spec.initContainers{
                  name: variables.containerName,
                  image: variables.image,
                  imagePullPolicy: variables.imagePullPolicy,
                  ?restartPolicy: variables.isInit ? optional.none() : optional.of("Always"),
                  env: [
                    Object.spec.initContainers.env{
                      name: "MY_POD_NAME",
                      valueFrom: Object.spec.initContainers.env.valueFrom{
                        fieldRef: Object.spec.initContainers.env.valueFrom.fieldRef{fieldPath: "metadata.name"}
                      }
                    },
                    Object.spec.initContainers.env{
                      name: "MY_POD_NAMESPACE",
                      valueFrom: Object.spec.initContainers.env.valueFrom{
                        fieldRef: Object.spec.initContainers.env.valueFrom.fieldRef{fieldPath: "metadata.namespace"}
                      }
                    },
                    Object.spec.initContainers.env{name: "CONJUR_ACCOUNT", value: variables.conjurAccount},
                    Object.spec.initContainers.env{name: "CONJUR_APPLIANCE_URL", value: variables.conjurApplianceUrl},
                    Object.spec.initContainers.env{name: "CONJUR_AUTHENTICATOR_ID", value: variables.conjurAuthenticatorId},
                    Object.spec.initContainers.env{name: "CONJUR_AUTHN_URL", value: variables.conjurAuthnUrl},
                    Object.spec.initContainers.env{name: "CONJUR_SSL_CERTIFICATE", value: variables.conjurSslCertificate}
                  ] + (variables.useJwt ? [
                    Object.spec.initContainers.env{name: "JWT_TOKEN_PATH", value: "/var/run/secrets/tokens/jwt"}
                  ] : []),
                  volumeMounts: [
                    Object.spec.initContainers.volumeMounts{name: "podinfo", mountPath: "/conjur/podinfo", readOnly: true},
                    Object.spec.initContainers.volumeMounts{name: "conjur-status", mountPath: "/conjur/status"}
                  ] + (variables.pushToFile ? [
                    Object.spec.initContainers.volumeMounts{name: "conjur-secrets", mountPath: "/conjur/secrets"}
                  ] : []) + (variables.serviceAccountTokenVolume != "" ? [
                    Object.spec.initContainers.volumeMounts{
                      name: variables.serviceAccountTokenVolume,
                      mountPath: "/var/run/secrets/kubernetes.io/serviceaccount",
                      readOnly: true
                    }
                  ] : []) + (variables.useJwt ? [
                    Object.spec.initContainers.volumeMounts{name: "jwt-token", mountPath: "/var/run/secrets/tokens", readOnly: true}
                  ] : []),
                  ?lifecycle: variables.isInit ? optional.none() : optional.of(
                    Object.spec.initContainers.lifecycle{
                      postStart: Object.spec.initContainers.lifecycle.postStart{
                        exec: Object.spec.initContainers.lifecycle.postStart.exec{
                          command: ["/usr/local/bin/conjur-secrets-provided.sh"]
                        }
                      }
                    }
                  ),
                  securityContext: Object.spec.initContainers.securityContext{
                    allowPrivilegeEscalation: false,
                    capabilities: Object.spec.initContainers.securityContext.capabilities{drop: ["ALL"]},
                    seccompProfile: Object.spec.initContainers.securityContext.seccompProfile{type: "RuntimeDefault"}
                  }
                }
              ] + (has(object.spec.initContainers) ? object.spec.initContainers : [])
            }
          ] +
          object.spec.containers.filter(c, c.name in variables.volumeReceivers).map(c,
            JSONPatch{
              op: "add",
              path: "/spec/containers/" + string(variables.containerNames.indexOf(c.name)) + "/volumeMounts",
              value: (has(c.volumeMounts) ? c.volumeMounts : []) + (
                [
                  Object.spec.containers.volumeMounts{name: "conjur-status", mountPath: "/conjur/status"}
                ] + (variables.pushToFile ? [
                  Object.spec.containers.volumeMounts{name: "conjur-secrets", mountPath: "/conjur/secrets"}
                ] : [])
              ).filter(m, !has(c.volumeMounts) ||
                !c.volumeMounts.exists(e, e.name == m.name || e.mountPath == m.mountPath))
            }
          ) +
          [
            JSONPatch{
              op: "add",
              path: "/metadata/annotations/" + jsonpatch.escapeKey("conjur.org/status"),
              value: "injected"
            },
            JSONPatch{
              op: "add",
              path: "/metadata/annotations/" + jsonpatch.escapeKey("conjur.org/container-mode"),
              value: variables.containerMode
            },
            JSONPatch{
              op: "add",
              path: "/metadata/annotations/" + jsonpatch.escapeKey("conjur.org/secrets-destination"),
              value: variables.secretsDestination
            }
          ] +
          variables.injectorOnlyAnnotations.filter(k, k in variables.annotations).map(k,
            JSONPatch{op: "remove", path: "/metadata/annotations/" + jsonpatch.escapeKey(k)}
          )
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: secrets-manager-secrets-provider
  labels:
    app.kubernetes.io/part-of: secrets-manager-sidecars
spec:
  policyName: secrets-manager-secrets-provider
  paramRef:
    name: secrets-manager-sidecar-config
    namespace: secrets-manager
    # Allow, not Deny: params are resolved before matchConditions, so Deny
    # would block every pod in labelled namespaces if the ConfigMap went
    # missing. Pods that request injection are still rejected by the
    # secrets-manager-sidecar-injection ValidatingAdmissionPolicy.
    parameterNotFoundAction: Allow
  matchResources:
    # Same opt-in label as the webhook, so existing namespaces keep working.
    namespaceSelector:
      matchLabels:
        cyberark-sidecar-injector: enabled
