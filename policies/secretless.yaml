# Secrets Manager — Secretless Broker sidecar injection.
#
# Community alternative to the `conjur.org/inject-type: secretless` path of the
# cyberark/sidecar-injector webhook (pkg/inject/secretless.go).
#
# `conjur.org/secretless-config` accepts the same three forms as the webhook:
#   1. <configmap-name>              (legacy; same as configfile#<configmap-name>)
#   2. configfile#<configmap-name>   -> ConfigMap mounted at /etc/secretless
#   3. k8s/crd#<crd-name>            -> passed straight to `-config-mgr`
#
# Injected into the pod:
#   * Secretless container at the FRONT of spec.initContainers as a native
#     sidecar (restartPolicy: Always), so the broker is listening before the
#     application starts and is stopped after it (Jobs complete normally)
#   * secretless-config volume + mount (configfile mode only)
#   * The pod's service account token mount (needed by the k8s/crd config
#     manager and the Secrets Manager provider). The webhook rejected pods
#     without one; here it is mounted when present and skipped otherwise.
#   * Secrets Manager connection env vars when the pod references
#     conjurConnConfig / conjurAuthConfig, or the cluster parameter ConfigMap
#     defines an appliance URL
#   * Annotations: conjur.org/status=injected, injector-only annotations removed
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: secrets-manager-secretless
  labels:
    app.kubernetes.io/part-of: secrets-manager-sidecars
spec:
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "kube-public"]
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: injection-requested
      expression: >-
        has(object.metadata.annotations) &&
        object.metadata.annotations[?'conjur.org/inject'].orValue('').lowerAscii() in ['y', 'yes', 'true', 'on']
    - name: inject-type-secretless
      expression: >-
        object.metadata.annotations[?'conjur.org/inject-type'].orValue('') == 'secretless'
    - name: not-already-injected
      expression: >-
        object.metadata.annotations[?'conjur.org/status'].orValue('').lowerAscii() != 'injected'
    - name: secretless-config-provided
      expression: >-
        object.metadata.annotations[?'conjur.org/secretless-config'].orValue('') != ''
  failurePolicy: Fail
  reinvocationPolicy: Never
  variables:
    - name: annotations
      expression: object.metadata.annotations
    - name: config
      expression: "has(params.data) ? params.data : {}"
    - name: image
      expression: >-
        variables.annotations[?'conjur.org/container-image'].orValue('') != ''
          ? variables.annotations['conjur.org/container-image']
          : variables.config[?'secretlessImage'].orValue('cyberark/secretless-broker:latest')
    - name: imagePullPolicy
      expression: >-
        variables.config[?'imagePullPolicy'].orValue('IfNotPresent')
    - name: secretlessConfig
      expression: variables.annotations['conjur.org/secretless-config']
    - name: configMgr
      expression: >-
        variables.secretlessConfig.contains('#') ? variables.secretlessConfig.split('#')[0] : 'configfile'
    - name: configSpec
      expression: >-
        variables.secretlessConfig.contains('#') ? variables.secretlessConfig.split('#')[1] : variables.secretlessConfig
    - name: usesConfigFile
      expression: variables.configMgr == 'configfile'
    - name: configMgrArg
      expression: >-
        variables.usesConfigFile
          ? 'configfile#/etc/secretless/secretless.yml'
          : variables.configMgr + '#' + variables.configSpec
    - name: crdSuffix
      expression: >-
        variables.annotations[?'conjur.org/secretless-CRD-suffix'].orValue('')
    - name: connConfigMap
      expression: >-
        variables.annotations[?'conjur.org/conjurConnConfig'].orValue('')
    - name: authConfigMap
      expression: >-
        variables.annotations[?'conjur.org/conjurAuthConfig'].orValue('')
    - name: authnIdentity
      expression: >-
        variables.annotations[?'conjur.org/authn-identity'].orValue('')
    - name: conjurAccount
      expression: >-
        variables.config[?'CONJUR_ACCOUNT'].orValue(variables.config[?'conjurAccount'].orValue(''))
    - name: conjurApplianceUrl
      expression: >-
        variables.config[?'CONJUR_APPLIANCE_URL'].orValue(variables.config[?'conjurApplianceUrl'].orValue(''))
    - name: conjurAuthenticatorId
      expression: >-
        variables.config[?'CONJUR_AUTHENTICATOR_ID'].orValue(variables.config[?'authnK8sAuthenticatorID'].orValue(''))
    - name: conjurAuthnUrl
      expression: >-
        variables.config[?'CONJUR_AUTHN_URL'].orValue('') != ''
          ? variables.config['CONJUR_AUTHN_URL']
          : variables.conjurApplianceUrl + '/authn-k8s/' + variables.conjurAuthenticatorId
    - name: conjurSslCertificate
      expression: >-
        variables.config[?'CONJUR_SSL_CERTIFICATE'].orValue(variables.config[?'conjurSslCertificate'].orValue(''))
    - name: conjurVersion
      expression: >-
        variables.config[?'CONJUR_VERSION'].orValue(variables.config[?'conjurVersion'].orValue('5'))
    - name: injectConjurEnv
      expression: >-
        variables.connConfigMap != '' || variables.authConfigMap != '' || variables.conjurApplianceUrl != ''
    - name: serviceAccountTokenVolume
      expression: >-
        object.spec.containers.exists(c, has(c.volumeMounts) &&
            c.volumeMounts.exists(m, m.mountPath == '/var/run/secrets/kubernetes.io/serviceaccount'))
          ? object.spec.containers
              .filter(c, has(c.volumeMounts) &&
                c.volumeMounts.exists(m, m.mountPath == '/var/run/secrets/kubernetes.io/serviceaccount'))[0]
              .volumeMounts
              .filter(m, m.mountPath == '/var/run/secrets/kubernetes.io/serviceaccount')[0].name
          : ''
    - name: existingVolumeNames
      expression: >-
        has(object.spec.volumes) ? object.spec.volumes.map(v, v.name) : []
    - name: injectorOnlyAnnotations
      expression: >-
        [
          'conjur.org/conjurAuthConfig',
          'conjur.org/conjurConnConfig',
          'conjur.org/container-name',
          'conjur.org/conjur-inject-volumes',
          'conjur.org/inject',
          'conjur.org/inject-type',
          'conjur.org/secretless-config',
          'conjur.org/secretless-CRD-suffix',
          'conjur.org/container-image'
        ]
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >
          [
            JSONPatch{
              op: "add",
              path: "/spec/volumes",
              value: (has(object.spec.volumes) ? object.spec.volumes : []) + (variables.usesConfigFile ? [
                Object.spec.volumes{
                  name: "secretless-config",
                  configMap: Object.spec.volumes.configMap{name: variables.configSpec}
                }
              ] : []).filter(v, !(v.name in variables.existingVolumeNames))
            },
            JSONPatch{
              op: "add",
              path: "/spec/initContainers",
              value: [
                Object.spec.initContainers{
                  name: "secretless",
                  image: variables.image,
                  imagePullPolicy: variables.imagePullPolicy,
                  restartPolicy: "Always",
                  args: ["-config-mgr", variables.configMgrArg],
                  env: [
                    Object.spec.initContainers.env{
                      name: "MY_POD_IP",
                      valueFrom: Object.spec.initContainers.env.valueFrom{
                        fieldRef: Object.spec.initContainers.env.valueFrom.fieldRef{fieldPath: "status.podIP"}
                      }
                    },
                    Object.spec.initContainers.env{
                      name: "MY_POD_NAME",
                      valueFrom: Object.spec.initContainers.env.valueFrom{
                        fieldRef: Object.spec.initContainers.env.valueFrom.fieldRef{fieldPath: "metadata.name"}
                      }
                    },
                    Object.spec.initContainers.env{
                      name: "MY_POD_NAMESPACE",
                      valueFrom: Object.spec.initContainers.env.valueFrom{
                        fieldRef: Object.spec.initContainers.env.valueFrom.fieldRef{fieldPath: "metadata.namespace"}
                      }
                    }
                  ] + (variables.crdSuffix != "" ? [
                    Object.spec.initContainers.env{name: "SECRETLESS_CRD_SUFFIX", value: variables.crdSuffix}
                  ] : []) + (variables.injectConjurEnv ? [
                    variables.connConfigMap != ""
                      ? Object.spec.initContainers.env{
                          name: "CONJUR_ACCOUNT",
                          valueFrom: Object.spec.initContainers.env.valueFrom{
                            configMapKeyRef: Object.spec.initContainers.env.valueFrom.configMapKeyRef{
                              name: variables.connConfigMap, key: "CONJUR_ACCOUNT"
                            }
                          }
                        }
                      : Object.spec.initContainers.env{name: "CONJUR_ACCOUNT", value: variables.conjurAccount},
                    variables.connConfigMap != ""
                      ? Object.spec.initContainers.env{
                          name: "CONJUR_APPLIANCE_URL",
                          valueFrom: Object.spec.initContainers.env.valueFrom{
                            configMapKeyRef: Object.spec.initContainers.env.valueFrom.configMapKeyRef{
                              name: variables.connConfigMap, key: "CONJUR_APPLIANCE_URL"
                            }
                          }
                        }
                      : Object.spec.initContainers.env{name: "CONJUR_APPLIANCE_URL", value: variables.conjurApplianceUrl},
                    variables.authConfigMap != ""
                      ? Object.spec.initContainers.env{
                          name: "CONJUR_AUTHN_LOGIN",
                          valueFrom: Object.spec.initContainers.env.valueFrom{
                            configMapKeyRef: Object.spec.initContainers.env.valueFrom.configMapKeyRef{
                              name: variables.authConfigMap, key: "CONJUR_AUTHN_LOGIN"
                            }
                          }
                        }
                      : Object.spec.initContainers.env{name: "CONJUR_AUTHN_LOGIN", value: variables.authnIdentity},
                    variables.connConfigMap != ""
                      ? Object.spec.initContainers.env{
                          name: "CONJUR_AUTHN_URL",
                          valueFrom: Object.spec.initContainers.env.valueFrom{
                            configMapKeyRef: Object.spec.initContainers.env.valueFrom.configMapKeyRef{
                              name: variables.connConfigMap, key: "CONJUR_AUTHN_URL"
                            }
                          }
                        }
                      : Object.spec.initContainers.env{name: "CONJUR_AUTHN_URL", value: variables.conjurAuthnUrl},
                    variables.connConfigMap != ""
                      ? Object.spec.initContainers.env{
                          name: "CONJUR_SSL_CERTIFICATE",
                          valueFrom: Object.spec.initContainers.env.valueFrom{
                            configMapKeyRef: Object.spec.initContainers.env.valueFrom.configMapKeyRef{
                              name: variables.connConfigMap, key: "CONJUR_SSL_CERTIFICATE"
                            }
                          }
                        }
                      : Object.spec.initContainers.env{name: "CONJUR_SSL_CERTIFICATE", value: variables.conjurSslCertificate},
                    variables.connConfigMap != ""
                      ? Object.spec.initContainers.env{
                          name: "CONJUR_VERSION",
                          valueFrom: Object.spec.initContainers.env.valueFrom{
                            configMapKeyRef: Object.spec.initContainers.env.valueFrom.configMapKeyRef{
                              name: variables.connConfigMap, key: "CONJUR_VERSION"
                            }
                          }
                        }
                      : Object.spec.initContainers.env{name: "CONJUR_VERSION", value: variables.conjurVersion}
                  ] : []),
                  volumeMounts: (variables.serviceAccountTokenVolume != "" ? [
                    Object.spec.initContainers.volumeMounts{
                      name: variables.serviceAccountTokenVolume,
                      mountPath: "/var/run/secrets/kubernetes.io/serviceaccount",
                      readOnly: true
                    }
                  ] : []) + (variables.usesConfigFile ? [
                    Object.spec.initContainers.volumeMounts{name: "secretless-config", mountPath: "/etc/secretless", readOnly: true}
                  ] : []),
                  securityContext: Object.spec.initContainers.securityContext{
                    allowPrivilegeEscalation: false,
                    capabilities: Object.spec.initContainers.securityContext.capabilities{drop: ["ALL"]},
                    seccompProfile: Object.spec.initContainers.securityContext.seccompProfile{type: "RuntimeDefault"}
                  }
                }
              ] + (has(object.spec.initContainers) ? object.spec.initContainers : [])
            },
            JSONPatch{
              op: "add",
              path: "/metadata/annotations/" + jsonpatch.escapeKey("conjur.org/status"),
              value: "injected"
            }
          ] +
          variables.injectorOnlyAnnotations.filter(k, k in variables.annotations).map(k,
            JSONPatch{op: "remove", path: "/metadata/annotations/" + jsonpatch.escapeKey(k)}
          )
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: secrets-manager-secretless
  labels:
    app.kubernetes.io/part-of: secrets-manager-sidecars
spec:
  policyName: secrets-manager-secretless
  paramRef:
    name: secrets-manager-sidecar-config
    namespace: secrets-manager
    # Allow, not Deny: params are resolved before matchConditions, so Deny
    # would block every pod in labelled namespaces if the ConfigMap went
    # missing. Pods that request injection are still rejected by the
    # secrets-manager-sidecar-injection ValidatingAdmissionPolicy.
    parameterNotFoundAction: Allow
  matchResources:
    namespaceSelector:
      matchLabels:
        cyberark-sidecar-injector: enabled
