# Secrets Manager — Kubernetes Authenticator client (conjur-authn-k8s-client)
# sidecar injection.
#
# Replaces the `conjur.org/inject-type: authenticator` path of the
# cyberark/sidecar-injector webhook (pkg/inject/authenticator.go).
#
# Injected into the pod:
#   * Authenticator container at the FRONT of spec.initContainers
#       - container-mode "init"    -> regular init container
#       - container-mode "sidecar" -> native sidecar (restartPolicy: Always),
#         which also lets Jobs complete instead of hanging on the sidecar
#   * Volume conjur-access-token (memory), unless one already exists
#   * Read-only /run/conjur mount on every container listed in
#     `conjur.org/conjur-inject-volumes`
#   * Annotations: conjur.org/status=injected, injector-only annotations removed
#
# Connection settings, per variable:
#   * `conjur.org/conjurConnConfig` set -> configMapKeyRef into that namespace
#     ConfigMap (webhook behaviour)
#   * otherwise                          -> literal values from the cluster
#     parameter ConfigMap (no per-namespace ConfigMap needed)
# Host identity:
#   * `conjur.org/conjurAuthConfig` set -> CONJUR_AUTHN_LOGIN from that ConfigMap
#   * otherwise                          -> CONJUR_AUTHN_LOGIN from
#     `conjur.org/authn-identity` (same annotation Secrets Provider uses)
apiVersion: admissionregistration.k8s.io/v1beta1
kind: MutatingAdmissionPolicy
metadata:
  name: secrets-manager-authenticator
  labels:
    app.kubernetes.io/part-of: secrets-manager-sidecars
spec:
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "kube-public"]
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: injection-requested
      expression: >-
        has(object.metadata.annotations) &&
        object.metadata.annotations[?'conjur.org/inject'].orValue('').lowerAscii() in ['y', 'yes', 'true', 'on']
    - name: inject-type-authenticator
      expression: >-
        object.metadata.annotations[?'conjur.org/inject-type'].orValue('') == 'authenticator'
    - name: not-already-injected
      expression: >-
        object.metadata.annotations[?'conjur.org/status'].orValue('').lowerAscii() != 'injected'
    - name: valid-container-mode
      expression: >-
        object.metadata.annotations[?'conjur.org/container-mode'].orValue('') in ['', 'init', 'sidecar']
    - name: host-identity-provided
      expression: >-
        object.metadata.annotations[?'conjur.org/conjurAuthConfig'].orValue('') != '' ||
        object.metadata.annotations[?'conjur.org/authn-identity'].orValue('') != ''
  failurePolicy: Fail
  reinvocationPolicy: Never
  variables:
    - name: annotations
      expression: object.metadata.annotations
    - name: config
      expression: "has(params.data) ? params.data : {}"
    - name: isInit
      expression: >-
        variables.annotations[?'conjur.org/container-mode'].orValue('') == 'init'
    - name: containerMode
      expression: "variables.isInit ? 'init' : 'sidecar'"
    - name: containerName
      expression: >-
        variables.annotations[?'conjur.org/container-name'].orValue('') != ''
          ? variables.annotations['conjur.org/container-name']
          : 'authenticator'
    - name: image
      expression: >-
        variables.annotations[?'conjur.org/container-image'].orValue('') != ''
          ? variables.annotations['conjur.org/container-image']
          : variables.config[?'authenticatorImage'].orValue('cyberark/conjur-authn-k8s-client:latest')
    - name: imagePullPolicy
      expression: >-
        variables.config[?'imagePullPolicy'].orValue('IfNotPresent')
    - name: connConfigMap
      expression: >-
        variables.annotations[?'conjur.org/conjurConnConfig'].orValue('')
    - name: authConfigMap
      expression: >-
        variables.annotations[?'conjur.org/conjurAuthConfig'].orValue('')
    - name: authnIdentity
      expression: >-
        variables.annotations[?'conjur.org/authn-identity'].orValue('')
    - name: conjurAccount
      expression: >-
        variables.config[?'CONJUR_ACCOUNT'].orValue(variables.config[?'conjurAccount'].orValue(''))
    - name: conjurApplianceUrl
      expression: >-
        variables.config[?'CONJUR_APPLIANCE_URL'].orValue(variables.config[?'conjurApplianceUrl'].orValue(''))
    - name: conjurAuthenticatorId
      expression: >-
        variables.config[?'CONJUR_AUTHENTICATOR_ID'].orValue(variables.config[?'authnK8sAuthenticatorID'].orValue(''))
    - name: conjurAuthnUrl
      expression: >-
        variables.config[?'CONJUR_AUTHN_URL'].orValue('') != ''
          ? variables.config['CONJUR_AUTHN_URL']
          : variables.conjurApplianceUrl + '/authn-k8s/' + variables.conjurAuthenticatorId
    - name: conjurSslCertificate
      expression: >-
        variables.config[?'CONJUR_SSL_CERTIFICATE'].orValue(variables.config[?'conjurSslCertificate'].orValue(''))
    - name: conjurVersion
      expression: >-
        variables.config[?'CONJUR_VERSION'].orValue(variables.config[?'conjurVersion'].orValue('5'))
    - name: existingVolumeNames
      expression: >-
        has(object.spec.volumes) ? object.spec.volumes.map(v, v.name) : []
    - name: containerNames
      expression: object.spec.containers.map(c, c.name)
    - name: volumeReceivers
      expression: >-
        variables.annotations[?'conjur.org/conjur-inject-volumes'].orValue('')
          .split(',').map(n, n.trim()).filter(n, n != '')
    - name: injectorOnlyAnnotations
      expression: >-
        [
          'conjur.org/conjurAuthConfig',
          'conjur.org/conjurConnConfig',
          'conjur.org/container-name',
          'conjur.org/conjur-inject-volumes',
          'conjur.org/inject',
          'conjur.org/inject-type',
          'conjur.org/secretless-config',
          'conjur.org/secretless-CRD-suffix',
          'conjur.org/container-image'
        ]
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >
          [
            JSONPatch{
              op: "add",
              path: "/spec/volumes",
              value: (has(object.spec.volumes) ? object.spec.volumes : []) + [
                Object.spec.volumes{
                  name: "conjur-access-token",
                  emptyDir: Object.spec.volumes.emptyDir{medium: "Memory"}
                }
              ].filter(v, !(v.name in variables.existingVolumeNames))
            },
            JSONPatch{
              op: "add",
              path: "/spec/initContainers",
              value: [
                Object.spec.initContainers{
                  name: variables.containerName,
                  image: variables.image,
                  imagePullPolicy: variables.imagePullPolicy,
                  ?restartPolicy: variables.isInit ? optional.none() : optional.of("Always"),
                  env: [
                    variables.connConfigMap != ""
                      ? Object.spec.initContainers.env{
                          name: "CONJUR_ACCOUNT",
                          valueFrom: Object.spec.initContainers.env.valueFrom{
                            configMapKeyRef: Object.spec.initContainers.env.valueFrom.configMapKeyRef{
                              name: variables.connConfigMap, key: "CONJUR_ACCOUNT"
                            }
                          }
                        }
                      : Object.spec.initContainers.env{name: "CONJUR_ACCOUNT", value: variables.conjurAccount},
                    variables.connConfigMap != ""
                      ? Object.spec.initContainers.env{
                          name: "CONJUR_APPLIANCE_URL",
                          valueFrom: Object.spec.initContainers.env.valueFrom{
                            configMapKeyRef: Object.spec.initContainers.env.valueFrom.configMapKeyRef{
                              name: variables.connConfigMap, key: "CONJUR_APPLIANCE_URL"
                            }
                          }
                        }
                      : Object.spec.initContainers.env{name: "CONJUR_APPLIANCE_URL", value: variables.conjurApplianceUrl},
                    variables.authConfigMap != ""
                      ? Object.spec.initContainers.env{
                          name: "CONJUR_AUTHN_LOGIN",
                          valueFrom: Object.spec.initContainers.env.valueFrom{
                            configMapKeyRef: Object.spec.initContainers.env.valueFrom.configMapKeyRef{
                              name: variables.authConfigMap, key: "CONJUR_AUTHN_LOGIN"
                            }
                          }
                        }
                      : Object.spec.initContainers.env{name: "CONJUR_AUTHN_LOGIN", value: variables.authnIdentity},
                    Object.spec.initContainers.env{
                      name: "CONJUR_AUTHN_TOKEN_FILE",
                      value: "/run/conjur/conjur-access-token"
                    },
                    variables.connConfigMap != ""
                      ? Object.spec.initContainers.env{
                          name: "CONJUR_AUTHN_URL",
                          valueFrom: Object.spec.initContainers.env.valueFrom{
                            configMapKeyRef: Object.spec.initContainers.env.valueFrom.configMapKeyRef{
                              name: variables.connConfigMap, key: "CONJUR_AUTHN_URL"
                            }
                          }
                        }
                      : Object.spec.initContainers.env{name: "CONJUR_AUTHN_URL", value: variables.conjurAuthnUrl},
                    variables.connConfigMap != ""
                      ? Object.spec.initContainers.env{
                          name: "CONJUR_SSL_CERTIFICATE",
                          valueFrom: Object.spec.initContainers.env.valueFrom{
                            configMapKeyRef: Object.spec.initContainers.env.valueFrom.configMapKeyRef{
                              name: variables.connConfigMap, key: "CONJUR_SSL_CERTIFICATE"
                            }
                          }
                        }
                      : Object.spec.initContainers.env{name: "CONJUR_SSL_CERTIFICATE", value: variables.conjurSslCertificate},
                    variables.connConfigMap != ""
                      ? Object.spec.initContainers.env{
                          name: "CONJUR_VERSION",
                          valueFrom: Object.spec.initContainers.env.valueFrom{
                            configMapKeyRef: Object.spec.initContainers.env.valueFrom.configMapKeyRef{
                              name: variables.connConfigMap, key: "CONJUR_VERSION"
                            }
                          }
                        }
                      : Object.spec.initContainers.env{name: "CONJUR_VERSION", value: variables.conjurVersion},
                    Object.spec.initContainers.env{name: "CONTAINER_MODE", value: variables.containerMode},
                    Object.spec.initContainers.env{
                      name: "MY_POD_IP",
                      valueFrom: Object.spec.initContainers.env.valueFrom{
                        fieldRef: Object.spec.initContainers.env.valueFrom.fieldRef{fieldPath: "status.podIP"}
                      }
                    },
                    Object.spec.initContainers.env{
                      name: "MY_POD_NAME",
                      valueFrom: Object.spec.initContainers.env.valueFrom{
                        fieldRef: Object.spec.initContainers.env.valueFrom.fieldRef{fieldPath: "metadata.name"}
                      }
                    },
                    Object.spec.initContainers.env{
                      name: "MY_POD_NAMESPACE",
                      valueFrom: Object.spec.initContainers.env.valueFrom{
                        fieldRef: Object.spec.initContainers.env.valueFrom.fieldRef{fieldPath: "metadata.namespace"}
                      }
                    }
                  ],
                  volumeMounts: [
                    Object.spec.initContainers.volumeMounts{name: "conjur-access-token", mountPath: "/run/conjur"}
                  ],
                  securityContext: Object.spec.initContainers.securityContext{
                    allowPrivilegeEscalation: false,
                    capabilities: Object.spec.initContainers.securityContext.capabilities{drop: ["ALL"]},
                    seccompProfile: Object.spec.initContainers.securityContext.seccompProfile{type: "RuntimeDefault"}
                  }
                }
              ] + (has(object.spec.initContainers) ? object.spec.initContainers : [])
            }
          ] +
          object.spec.containers.filter(c, c.name in variables.volumeReceivers).map(c,
            JSONPatch{
              op: "add",
              path: "/spec/containers/" + string(variables.containerNames.indexOf(c.name)) + "/volumeMounts",
              value: (has(c.volumeMounts) ? c.volumeMounts : []) + [
                Object.spec.containers.volumeMounts{name: "conjur-access-token", mountPath: "/run/conjur", readOnly: true}
              ].filter(m, !has(c.volumeMounts) ||
                !c.volumeMounts.exists(e, e.name == m.name || e.mountPath == m.mountPath))
            }
          ) +
          [
            JSONPatch{
              op: "add",
              path: "/metadata/annotations/" + jsonpatch.escapeKey("conjur.org/status"),
              value: "injected"
            }
          ] +
          variables.injectorOnlyAnnotations.filter(k, k in variables.annotations).map(k,
            JSONPatch{op: "remove", path: "/metadata/annotations/" + jsonpatch.escapeKey(k)}
          )
---
apiVersion: admissionregistration.k8s.io/v1beta1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: secrets-manager-authenticator
  labels:
    app.kubernetes.io/part-of: secrets-manager-sidecars
spec:
  policyName: secrets-manager-authenticator
  paramRef:
    name: secrets-manager-sidecar-config
    namespace: secrets-manager
    parameterNotFoundAction: Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        cyberark-sidecar-injector: enabled
