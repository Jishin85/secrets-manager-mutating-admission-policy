# Secretless Broker as a native sidecar, configured from a ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-secretless-config
  namespace: app-test
data:
  secretless.yml: |
    version: 2
    services:
      pg:
        connector: pg
        listenOn: tcp://localhost:5432
        credentials:
          host:
            from: conjur
            get: db-credentials/host
          username:
            from: conjur
            get: db-credentials/username
          password:
            from: conjur
            get: db-credentials/password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secretless-demo
  namespace: app-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secretless-demo
  template:
    metadata:
      labels:
        app: secretless-demo
      annotations:
        conjur.org/inject: "true"
        conjur.org/inject-type: secretless
        conjur.org/secretless-config: configfile#demo-secretless-config
        conjur.org/authn-identity: host/conjur/authn-k8s/my-authenticator-id/apps/app-test/service_account/secretless-demo
    spec:
      serviceAccountName: secretless-demo
      containers:
        - name: app
          image: postgres:16
          # Connects through Secretless with no credentials of its own.
          command: ["sh", "-c", "psql -h localhost -p 5432 -c 'select 1' && sleep infinity"]
