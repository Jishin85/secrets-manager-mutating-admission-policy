# Secrets Provider as a native sidecar, push-to-file mode.
#
# Prerequisite: the namespace is labelled for injection
#   kubectl label namespace app-test cyberark-sidecar-injector=enabled
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: app-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
      # Annotations go on the Pod template, not on the Deployment.
      annotations:
        # --- Consumed by the admission policy (removed after injection) ----
        conjur.org/inject: "true"
        conjur.org/inject-type: secrets-provider
        conjur.org/conjur-inject-volumes: app
        # --- Consumed by Secrets Provider at runtime -----------------------
        conjur.org/container-mode: sidecar
        conjur.org/secrets-destination: file
        conjur.org/authn-identity: host/conjur/authn-k8s/my-authenticator-id/apps/app-test/service_account/demo-app
        conjur.org/conjur-secrets.db: |
          - url: db-credentials/url
          - username: db-credentials/username
          - password: db-credentials/password
        conjur.org/secret-file-path.db: db.yaml
        conjur.org/secret-file-format.db: yaml
        conjur.org/secrets-refresh-enabled: "true"
        conjur.org/secrets-refresh-interval: 5m
    spec:
      serviceAccountName: demo-app
      containers:
        - name: app
          image: busybox:1.36
          # Secrets are already on disk when this container starts: the
          # injected native sidecar's postStart hook holds back app startup
          # until the first batch of secrets is written.
          command: ["sh", "-c", "cat /conjur/secrets/db.yaml && sleep infinity"]
