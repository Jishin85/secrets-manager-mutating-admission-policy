# Authenticator client as a native sidecar, with no per-namespace ConfigMaps:
# connection settings come from the cluster parameter ConfigMap and the host
# identity from `conjur.org/authn-identity`.
#
# To keep using namespace ConfigMaps as with the webhook, set
# `conjur.org/conjurConnConfig` / `conjur.org/conjurAuthConfig` instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: token-consumer
  namespace: app-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: token-consumer
  template:
    metadata:
      labels:
        app: token-consumer
      annotations:
        conjur.org/inject: "true"
        conjur.org/inject-type: authenticator
        conjur.org/container-mode: sidecar
        conjur.org/authn-identity: host/conjur/authn-k8s/my-authenticator-id/apps/app-test/service_account/token-consumer
        conjur.org/conjur-inject-volumes: app
    spec:
      serviceAccountName: token-consumer
      containers:
        - name: app
          image: busybox:1.36
          # The access token is refreshed by the sidecar at this path.
          command: ["sh", "-c", "until [ -s /run/conjur/conjur-access-token ]; do sleep 1; done; sleep infinity"]
